name: Release

# Runs on GitHub only: the empty .forgejo/workflows/ makes Forgejo ignore .github/workflows/.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OCRCOPY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Gradle reads ORG_GRADLE_PROJECT_<name> env vars as project properties,
      # same as ~/.gradle/gradle.properties locally.
      - name: Build signed APK
        env:
          ORG_GRADLE_PROJECT_OCRCOPY_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_OCRCOPY_STORE_PASSWORD: ${{ secrets.OCRCOPY_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_OCRCOPY_KEY_ALIAS: ${{ secrets.OCRCOPY_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_OCRCOPY_KEY_PASSWORD: ${{ secrets.OCRCOPY_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "ocrcopy-$GITHUB_REF_NAME.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v v="$VERSION" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md)
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest APK
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ocrcopy-${{ github.ref_name }}.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" \
            "ocrcopy-$GITHUB_REF_NAME.apk"
